# Pxmm CAM - Configuração
# Streaming apenas por: USB (câmera externa) ou GigE/LAN (Ethernet).

streaming:
  source_type: usb   # usb (entrada USB) | gige (rede Ethernet)
  usb_camera_index: 1   # índice da câmera USB; 0 não é usado (apenas USB externa)
  gige_ip: ""
  gige_port: 3956
  gige_backend: auto   # auto | harvester | gstreamer | opencv
  gentl_producer_path: ""   # obrigatório para Harvester; ex: /path/to/producer.cti
  requested_width: null    # opcional
  requested_height: null
  target_fps: null

ui:
  auto_export: false

export:
  default_dir: ""
